<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Asset Management System for Textures -->
      <a-assets>
        <img id="road-texture" src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Asphalt_texture.jpg/512px-Asphalt_texture.jpg">
        <img id="snow-texture" src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Snow_texture_2.jpg/512px-Snow_texture_2.jpg">
      </a-assets>

      <a-camera position="0 1.4 15"></a-camera>
      
      <!-- GROUND PLANES -->
      <!-- Center Road (Asphalt) -->
      <a-plane position="0 0 -2" rotation="-90 0 0" width="40" height="15" src="#road-texture" repeat="10 4"></a-plane>
      
      <!-- Front Sidewalk (Snow) -->
      <a-plane position="0 0 8" rotation="-90 0 0" width="40" height="5" src="#snow-texture" repeat="10 2"></a-plane>
      
      <!-- Back Sidewalk (Snow) -->
      <a-plane position="0 0 -12" rotation="-90 0 0" width="40" height="5" src="#snow-texture" repeat="10 2"></a-plane>

      <!-- First Car -->
      <a-entity id="CAR" position="7 -3 -2" rotation="0 -90 0">
        <!-- Wheels -->
        <a-cylinder position="-1.3 3 3.65" height="0.6" radius="1" color="black" rotation="90 0 0"></a-cylinder>
        <a-cylinder position="-1.3 3 9.15" height="0.6" radius="1" color="black" rotation="90 0 0"></a-cylinder>
        <a-cylinder position="5.3 3 3.65" height="0.6" radius="1" color="black" rotation="90 0 0"></a-cylinder>
        <a-cylinder position="5.3 3 9.15" height="0.6" radius="1" color="black" rotation="90 0 0"></a-cylinder>
        
        <!-- Hubcaps (White Insides) -->
        <a-cylinder position="-1.3 3 9.46" height="0.1" radius="0.5" color="white" rotation="90 0 0"></a-cylinder>
        <a-cylinder position="5.3 3 9.46" height="0.1" radius="0.5" color="white" rotation="90 0 0"></a-cylinder>
        <a-cylinder position="-1.3 3 3.34" height="0.1" radius="0.5" color="white" rotation="90 0 0"></a-cylinder>
        <a-cylinder position="5.3 3 3.34" height="0.1" radius="0.5" color="white" rotation="90 0 0"></a-cylinder>

        <!-- Body & Cabin -->
        <a-box position="2 3.5 6.4" height="1.5" radius-bottom="2" radius-top="0.1" color="#d32f2f" width="10" depth="5"></a-box>
        <a-box position="2 5 6.4" height="1.5" radius-bottom="2" radius-top="0.1" color="#fbc02d" width="4" depth="5"></a-box>
        
        <!-- Windows -->
        <a-box position="0 5.1 6.4" width="0.15" height="0.9" depth="4.5" color="#eee"></a-box>
        <a-box position="1 5.1 3.9" width="1.5" height="0.9" depth="0.15" color="#eee"></a-box>
        <a-box position="3 5.1 3.9" width="1.5" height="0.9" depth="0.15" color="#eee"></a-box>
        <a-box position="1 5.1 8.9" width="1.5" height="0.9" depth="0.15" color="#eee"></a-box>
        <a-box position="3 5.1 8.9" width="1.5" height="0.9" depth="0.15" color="#eee"></a-box>
        <a-box position="4.05 5.1 6.4" width="0.15" height="0.9" depth="4.5" color="#eee"></a-box>

        <!-- Doors -->
        <a-box position="2 3.5 8.91" width="3.5" height="1.4" depth="0.05" color="#b71c1c"></a-box>
        <a-box position="3.2 3.8 8.95" width="0.5" height="0.15" depth="0.1" color="#222"></a-box>
        <a-box position="2 3.5 3.89" width="3.5" height="1.4" depth="0.05" color="#b71c1c"></a-box>
        <a-box position="3.2 3.8 3.85" width="0.5" height="0.15" depth="0.1" color="#222"></a-box>

        <!-- Grill & Headlights -->
        <a-box position="-3.01 3.5 4.5" width="0.1" height="0.4" depth="0.8" color="yellow"></a-box> 
        <a-box position="-3.01 3.5 8.3" width="0.1" height="0.4" depth="0.8" color="yellow"></a-box> 
        <a-box position="-3.01 3.3 6.4" width="0.1" height="0.6" depth="2.2" color="#222"></a-box>
        
        <!-- Tail lights -->
        <a-box position="7.01 3.5 4.5" width="0.1" height="0.3" depth="0.8" color="red"></a-box>
        <a-box position="7.01 3.5 8.3" width="0.1" height="0.3" depth="0.8" color="red"></a-box>
      </a-entity>

      <!-- Second Car -->
      <a-entity id="CAR2" position="-5 -3 -2" rotation="0 -90 0">
        <!-- Wheels -->
        <a-cylinder position="-1.3 3 3.65" height="0.6" radius="1" color="black" rotation="90 0 0"></a-cylinder>
        <a-cylinder position="-1.3 3 9.15" height="0.6" radius="1" color="black" rotation="90 0 0"></a-cylinder>
        <a-cylinder position="5.3 3 3.65" height="0.6" radius="1" color="black" rotation="90 0 0"></a-cylinder>
        <a-cylinder position="5.3 3 9.15" height="0.6" radius="1" color="black" rotation="90 0 0"></a-cylinder>
        
        <!-- Hubcaps (White Insides) -->
        <a-cylinder position="-1.3 3 9.46" height="0.1" radius="0.5" color="white" rotation="90 0 0"></a-cylinder>
        <a-cylinder position="5.3 3 9.46" height="0.1" radius="0.5" color="white" rotation="90 0 0"></a-cylinder>
        <a-cylinder position="-1.3 3 3.34" height="0.1" radius="0.5" color="white" rotation="90 0 0"></a-cylinder>
        <a-cylinder position="5.3 3 3.34" height="0.1" radius="0.5" color="white" rotation="90 0 0"></a-cylinder>

        <!-- Body & Cabin -->
        <a-box position="2 3.5 6.4" height="1.5" radius-bottom="2" radius-top="0.1" color="#d32f2f" width="10" depth="5"></a-box>
        <a-box position="2 5 6.4" height="1.5" radius-bottom="2" radius-top="0.1" color="#fbc02d" width="4" depth="5"></a-box>
        
        <!-- Windows -->
        <a-box position="0 5.1 6.4" width="0.15" height="0.9" depth="4.5" color="#eee"></a-box>
        <a-box position="1 5.1 3.9" width="1.5" height="0.9" depth="0.15" color="#eee"></a-box>
        <a-box position="3 5.1 3.9" width="1.5" height="0.9" depth="0.15" color="#eee"></a-box>
        <a-box position="1 5.1 8.9" width="1.5" height="0.9" depth="0.15" color="#eee"></a-box>
        <a-box position="3 5.1 8.9" width="1.5" height="0.9" depth="0.15" color="#eee"></a-box>
        <a-box position="4.05 5.1 6.4" width="0.15" height="0.9" depth="4.5" color="#eee"></a-box>

        <!-- Doors -->
        <a-box position="2 3.5 8.91" width="3.5" height="1.4" depth="0.05" color="#b71c1c"></a-box>
        <a-box position="3.2 3.8 8.95" width="0.5" height="0.15" depth="0.1" color="#222"></a-box>
        <a-box position="2 3.5 3.89" width="3.5" height="1.4" depth="0.05" color="#b71c1c"></a-box>
        <a-box position="3.2 3.8 3.85" width="0.5" height="0.15" depth="0.1" color="#222"></a-box>

        <!-- Grill & Headlights -->
        <a-box position="-3.01 3.5 4.5" width="0.1" height="0.4" depth="0.8" color="yellow"></a-box> 
        <a-box position="-3.01 3.5 8.3" width="0.1" height="0.4" depth="0.8" color="yellow"></a-box> 
        <a-box position="-3.01 3.3 6.4" width="0.1" height="0.6" depth="2.2" color="#222"></a-box>
        
        <!-- Tail lights -->
        <a-box position="7.01 3.5 4.5" width="0.1" height="0.3" depth="0.8" color="red"></a-box>
        <a-box position="7.01 3.5 8.3" width="0.1" height="0.3" depth="0.8" color="red"></a-box>
      </a-entity>

    </a-scene>
  </body>
</html>
