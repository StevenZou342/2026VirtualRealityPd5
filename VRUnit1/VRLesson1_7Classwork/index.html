<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>

      <a-entity id="blue-ghost" position="-5 0 -5">
        <a-sphere position="0 0.75 0" radius="0.5" color="blue"></a-sphere>
        <a-cylinder position="0 0.5 0" radius="0.5" height="0.5" color="blue"></a-cylinder>
        <a-sphere position="-0.25 0 0" radius="0.25" color="blue"></a-sphere>
        <a-sphere position="0 0 0" radius="0.25" color="blue"></a-sphere>
        <a-sphere position="0.25 0 0" radius="0.25" color="blue"></a-sphere>
        <a-sphere position="-0.25 1 0.5" radius="0.25" color="white"></a-sphere>
        <a-sphere position="0.25 1 0.5" radius="0.25" color="white"></a-sphere>
        <a-sphere position="-0.25 1 0.5" radius="0.125" color="black"></a-sphere>
          <a-sphere position="-0.25 1 0.75" radius="0.125" color="black"></a-sphere>
          <a-sphere position="0.25 1 0.75" radius="0.125" color="black"></a-sphere>

      <a-entity id="orangeghost" position="1 0 -5">
        <a-sphere position="0 0.75 0" radius="0.5" color="orange"></a-sphere>
        <a-cylinder position="0 0.5 0" radius="0.5" height="0.5" color="orange"></a-cylinder>
        <a-sphere position="-0.25 0 0" radius="0.25" color="orange"></a-sphere>
        <a-sphere position="0 0 0" radius="0.25" color="orange"></a-sphere>
        <a-sphere position="0.25 0 0" radius="0.25" color="orange"></a-sphere>
        <a-sphere position="-0.25 1 0.5" radius="0.25" color="white"></a-sphere>
        <a-sphere position="0.25 1 0.5" radius="0.25" color="white"></a-sphere>
          <a-sphere position="-0.25 1 0.75" radius="0.125" color="black"></a-sphere>
          <a-sphere position="0.25 1 0.75" radius="0.125" color="black"></a-sphere>
      </a-entity>

    </a-scene>
  </body>
</html>
